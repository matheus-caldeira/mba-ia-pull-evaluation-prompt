techniques_applied:
  - "Role Prompting: persona de Product Manager sênior com 10+ anos de experiência, que ancora o tom e o vocabulário de produto."
  - "Few-shot Learning: 4 exemplos completos entrada->saída (simples, médio de segurança, médio técnico e complexo), replicando o estilo das referências do dataset sem copiar seu conteúdo."
  - "Chain of Thought: roteiro de raciocínio em 5 passos (ator, comportamento esperado, benefício, complexidade, critérios), executado silenciosamente antes de emitir a resposta."
  - "Instruções explícitas de formato e comportamento: 6 regras numeradas, formato canônico da User Story e Gherkin em português."
  - "Tratamento de edge cases: relato vago, sem passos de reprodução, feature request disfarçada, múltiplos problemas e impacto de segurança."
